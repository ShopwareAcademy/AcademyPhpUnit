name: PHP unit test

on:
  pull_request:
    paths:
      - '**/*.php'
      - composer.json
      - phpunit.xml
      - .github/workflows/phpunit.yml
  push:
    paths:
      - '**/*.php'
      - composer.json
      - phpunit.xml
      - .github/workflows/phpunit.yml
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
jobs:
  phpunit:
    uses: shopware/github-actions/.github/workflows/phpunit.yml@main
    with:
      extensionName: ${{ github.event.repository.name }}
      shopwareVersion: trunk
